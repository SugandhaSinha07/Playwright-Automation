name: Playwright Tests
on:
  workflow_dispatch:   # run manually from the Actions tab
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      # Stable CI subset: public demo pages + flows using the TEST_PASSWORD demo account
      run: npx playwright test tests/example.spec.js tests/UIBasicstest.spec.js tests/FramesHandling.spec.js tests/ClientAppOther.spec.js
      env:
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
